<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Code Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #00e5a0;
    --accent2: #7c6bff;
    --danger: #ff4d6d;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --found: #00e5a0;
    --notfound: #ff4d6d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(124,107,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,107,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 0 40px;
  }

  /* Header */
  header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 20px;
  }

  /* Sections */
  .section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent2);
  }

  /* Provider tabs */
  .provider-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .provider-tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    border-radius: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .provider-tab.active {
    border-color: var(--accent2);
    color: var(--text);
    background: rgba(124,107,255,0.1);
    box-shadow: 0 0 0 1px var(--accent2);
  }

  .provider-tab:hover:not(.active) { border-color: var(--border); color: var(--text); }

  .key-hint {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: 'DM Mono', monospace;
  }

  .key-hint a { color: var(--accent2); text-decoration: none; }

  /* API Key input */
  .input-row {
    display: flex;
    gap: 8px;
  }

  input[type="password"], input[type="text"] {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--accent2); }

  button {
    cursor: pointer;
    border: none;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    transition: all 0.2s;
  }

  .btn-sm {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 12px;
    white-space: nowrap;
  }

  .btn-sm:hover { border-color: var(--accent2); color: var(--accent2); }

  /* CSV Upload */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent2);
    background: rgba(124,107,255,0.05);
  }

  .upload-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%;
  }

  .upload-icon { font-size: 32px; margin-bottom: 8px; }
  .upload-text { font-size: 14px; color: var(--muted); }
  .upload-text strong { color: var(--text); }

  .csv-status {
    margin-top: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    display: none;
  }

  /* Camera section */
  .camera-area {
    position: relative;
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 4/3;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #videoEl {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  #canvasEl { display: none; }

  .camera-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }

  .camera-placeholder .cam-icon { font-size: 48px; }
  .camera-placeholder p { font-size: 14px; }

  /* Viewfinder overlay */
  .viewfinder {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
  }

  .viewfinder::before, .viewfinder::after {
    content: '';
    position: absolute;
    width: 60%; height: 30%;
    left: 20%; top: 35%;
    border: 2px solid var(--accent);
    border-radius: 4px;
  }

  .viewfinder::after {
    background: rgba(0, 229, 160, 0.05);
  }

  .viewfinder-label {
    position: absolute;
    bottom: 30%;
    left: 50%; transform: translateX(-50%);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 1px;
    white-space: nowrap;
  }

  /* Camera controls */
  .cam-controls {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }

  .btn-primary {
    flex: 1;
    background: linear-gradient(135deg, var(--accent2), #5a4de8);
    color: white;
    padding: 14px;
    border-radius: 12px;
    font-size: 14px;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 20px rgba(124,107,255,0.3);
  }

  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(124,107,255,0.4); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.4; transform: none; cursor: not-allowed; }

  .btn-capture {
    background: var(--accent);
    color: #0a0a0f;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 14px;
    box-shadow: 0 4px 20px rgba(0,229,160,0.3);
  }

  .btn-capture:hover { transform: translateY(-1px); }

  /* OCR Result */
  .ocr-result {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-top: 12px;
    display: none;
  }

  .ocr-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .ocr-code {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 4px;
    color: var(--text);
    word-break: break-all;
  }

  .ocr-edit {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .ocr-edit input {
    flex: 1;
    font-size: 18px;
    letter-spacing: 2px;
    padding: 8px 12px;
  }

  /* Match result */
  .match-card {
    border-radius: 14px;
    padding: 20px;
    margin-top: 12px;
    display: none;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .match-found {
    background: rgba(0,229,160,0.08);
    border: 1px solid rgba(0,229,160,0.3);
  }

  .match-notfound {
    background: rgba(255,77,109,0.08);
    border: 1px solid rgba(255,77,109,0.3);
  }

  .match-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .match-icon { font-size: 24px; }

  .match-title {
    font-size: 16px;
    font-weight: 700;
  }

  .match-found .match-title { color: var(--found); }
  .match-notfound .match-title { color: var(--notfound); }

  .match-code {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .match-data {
    display: grid;
    gap: 6px;
  }

  .data-row {
    display: flex;
    gap: 8px;
    font-size: 13px;
  }

  .data-key {
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    min-width: 100px;
    font-size: 12px;
  }

  .data-val {
    color: var(--text);
    font-weight: 600;
    word-break: break-word;
  }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* History */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 200px;
    overflow-y: auto;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .history-item:hover { background: var(--border); }

  .history-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-found { background: var(--found); }
  .dot-notfound { background: var(--notfound); }

  .history-code { flex: 1; color: var(--text); letter-spacing: 1px; }
  .history-time { color: var(--muted); font-size: 10px; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 16px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%; transform: translateX(-50%);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
    pointer-events: none;
  }

  .toast.show { opacity: 1; }

  /* Preview image */
  #previewImg {
    width: 100%;
    border-radius: 12px;
    display: none;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">🔍</div>
      <h1>CodeScan</h1>
    </div>
    <span class="badge">11-DIGIT OCR</span>
  </header>

  <!-- Provider + API Key -->
  <div class="section">
    <div class="section-label"><span class="dot"></span>OCR Provider</div>
    <div class="provider-tabs">
      <button class="provider-tab active" id="tabClaude" onclick="selectProvider('claude')">
        <span class="provider-logo">🟣</span> Claude
      </button>
      <button class="provider-tab" id="tabGemini" onclick="selectProvider('gemini')">
        <span class="provider-logo">🔵</span> Gemini
      </button>
    </div>

    <div id="claudeKeyRow" class="key-row">
      <div class="key-hint">Anthropic key → <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></div>
      <div class="input-row">
        <input type="password" id="claudeKey" placeholder="sk-ant-..." autocomplete="off">
        <button class="btn-sm" onclick="toggleKey('claudeKey')">Show</button>
        <button class="btn-sm" onclick="saveKey('claude')">Save</button>
      </div>
    </div>

    <div id="geminiKeyRow" class="key-row" style="display:none">
      <div class="key-hint">Gemini key → <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com</a></div>
      <div class="input-row">
        <input type="password" id="geminiKey" placeholder="AIza..." autocomplete="off">
        <button class="btn-sm" onclick="toggleKey('geminiKey')">Show</button>
        <button class="btn-sm" onclick="saveKey('gemini')">Save</button>
      </div>
    </div>
  </div>

  <!-- CSV Upload -->
  <div class="section">
    <div class="section-label"><span class="dot"></span>Code Database (CSV)</div>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="csvFile" accept=".csv,.txt" onchange="loadCSV(this)">
      <div class="upload-icon">📋</div>
      <div class="upload-text"><strong>Upload CSV file</strong><br>First column = 11-digit codes</div>
    </div>
    <div class="csv-status" id="csvStatus"></div>
  </div>

  <!-- Camera -->
  <div class="section">
    <div class="section-label"><span class="dot"></span>Scan Code</div>
    <div class="camera-area" id="cameraArea">
      <div class="camera-placeholder" id="camPlaceholder">
        <div class="cam-icon">📷</div>
        <p>Tap to start camera</p>
      </div>
      <video id="videoEl" autoplay playsinline></video>
      <div class="viewfinder" id="viewfinder">
        <span class="viewfinder-label">AIM AT CODE</span>
      </div>
    </div>
    <canvas id="canvasEl"></canvas>
    <img id="previewImg" alt="captured">

    <div class="cam-controls">
      <button class="btn-primary" id="startCamBtn" onclick="startCamera()">Start Camera</button>
      <button class="btn-capture" id="captureBtn" onclick="captureAndScan()" style="display:none">
        📸 Capture
      </button>
    </div>

    <!-- OCR result with edit -->
    <div class="ocr-result" id="ocrResult">
      <div class="ocr-label">Detected Code</div>
      <div class="ocr-code" id="ocrCode">—</div>
      <div class="ocr-edit">
        <input type="text" id="editCode" placeholder="Edit if needed..." maxlength="20">
        <button class="btn-sm" onclick="lookupCode()">Search</button>
      </div>
    </div>

    <!-- Match card -->
    <div class="match-card" id="matchCard">
      <div class="match-header">
        <span class="match-icon" id="matchIcon"></span>
        <span class="match-title" id="matchTitle"></span>
      </div>
      <div class="match-code" id="matchCode"></div>
      <div class="match-data" id="matchData"></div>
    </div>
  </div>

  <!-- History -->
  <div class="section">
    <div class="section-label"><span class="dot"></span>Scan History</div>
    <div class="history-list" id="historyList">
      <div class="empty-state">No scans yet</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// State
let stream = null;
let codeDatabase = [];
let csvHeaders = [];
let scanHistory = [];
let activeProvider = 'claude';

// Init
document.addEventListener('DOMContentLoaded', () => {
  const savedClaude = localStorage.getItem('claude_key');
  const savedGemini = localStorage.getItem('gemini_key');
  const savedProvider = localStorage.getItem('ocr_provider') || 'claude';
  if (savedClaude) document.getElementById('claudeKey').value = savedClaude;
  if (savedGemini) document.getElementById('geminiKey').value = savedGemini;
  selectProvider(savedProvider, false);
});

function selectProvider(provider, save = true) {
  activeProvider = provider;
  if (save) localStorage.setItem('ocr_provider', provider);

  document.getElementById('tabClaude').classList.toggle('active', provider === 'claude');
  document.getElementById('tabGemini').classList.toggle('active', provider === 'gemini');
  document.getElementById('claudeKeyRow').style.display = provider === 'claude' ? 'block' : 'none';
  document.getElementById('geminiKeyRow').style.display = provider === 'gemini' ? 'block' : 'none';
}

function toggleKey(id) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function saveKey(provider) {
  const key = document.getElementById(provider === 'claude' ? 'claudeKey' : 'geminiKey').value.trim();
  if (key) {
    localStorage.setItem(provider + '_key', key);
    toast(`${provider === 'claude' ? 'Claude' : 'Gemini'} key saved ✓`);
  }
}

// CSV Loading
function loadCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => parseCSV(e.target.result, file.name);
  reader.readAsText(file);
}

function parseCSV(text, filename) {
  const lines = text.trim().split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) { toast('CSV too short'); return; }
  const delim = lines[0].includes('\t') ? '\t' : ',';
  csvHeaders = lines[0].split(delim).map(h => h.replace(/"/g, '').trim());
  codeDatabase = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = lines[i].split(delim).map(v => v.replace(/"/g, '').trim());
    if (!vals[0]) continue;
    const row = {};
    csvHeaders.forEach((h, idx) => row[h] = vals[idx] || '');
    codeDatabase.push(row);
  }
  const statusEl = document.getElementById('csvStatus');
  statusEl.style.display = 'block';
  statusEl.textContent = `✓ Loaded ${codeDatabase.length} records from "${filename}" · ${csvHeaders.length} columns`;
  toast(`${codeDatabase.length} codes loaded`);
}

// Camera
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    const video = document.getElementById('videoEl');
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('camPlaceholder').style.display = 'none';
    document.getElementById('viewfinder').style.display = 'block';
    document.getElementById('startCamBtn').style.display = 'none';
    document.getElementById('captureBtn').style.display = 'block';
    document.getElementById('previewImg').style.display = 'none';
  } catch (err) {
    toast('Camera access denied');
    console.error(err);
  }
}

async function captureAndScan() {
  const keyId = activeProvider === 'claude' ? 'claudeKey' : 'geminiKey';
  const apiKey = document.getElementById(keyId).value.trim();
  if (!apiKey) { toast(`Enter your ${activeProvider === 'claude' ? 'Claude' : 'Gemini'} API key first`); return; }

  const video = document.getElementById('videoEl');
  const canvas = document.getElementById('canvasEl');
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  const preview = document.getElementById('previewImg');
  preview.src = canvas.toDataURL('image/jpeg', 0.9);
  preview.style.display = 'block';

  if (stream) stream.getTracks().forEach(t => t.stop());
  video.style.display = 'none';
  document.getElementById('viewfinder').style.display = 'none';
  document.getElementById('captureBtn').style.display = 'none';

  const startBtn = document.getElementById('startCamBtn');
  startBtn.style.display = 'block';
  startBtn.disabled = true;
  startBtn.innerHTML = '<span class="spinner"></span> Reading...';

  const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
  const prompt = 'This image contains a handwritten numeric code. Extract ONLY the digits. The code should be exactly 11 digits long. Return ONLY the digits, nothing else. If you see multiple codes, return the most prominent one. If unsure about a digit, make your best guess.';

  try {
    let digits = '';
    let rawText = '';

    if (activeProvider === 'claude') {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({
          model: 'claude-opus-4-6',
          max_tokens: 100,
          messages: [{ role: 'user', content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
            { type: 'text', text: prompt }
          ]}]
        })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      rawText = data.content?.[0]?.text?.trim() || '';

    } else {
      // Gemini
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [
              { inline_data: { mime_type: 'image/jpeg', data: base64 } },
              { text: prompt }
            ]}]
          })
        }
      );
      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      rawText = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
    }

    digits = rawText.replace(/\D/g, '');
    showOCRResult(digits, rawText);

  } catch (err) {
    toast('OCR failed: ' + (err.message || 'Check API key'));
    console.error(err);
  }

  startBtn.disabled = false;
  startBtn.textContent = '🔄 Retake';
}

function showOCRResult(digits, raw) {
  const resultEl = document.getElementById('ocrResult');
  const codeEl = document.getElementById('ocrCode');
  const editEl = document.getElementById('editCode');
  resultEl.style.display = 'block';
  codeEl.textContent = digits || raw || '(nothing detected)';
  editEl.value = digits;
  if (digits.length === 11) {
    lookupCode(digits);
  } else {
    toast(`Got ${digits.length} digits — please edit and search`);
  }
}

function lookupCode(code) {
  const searchCode = code || document.getElementById('editCode').value.trim().replace(/\D/g, '');
  if (!searchCode) { toast('No code to search'); return; }
  if (codeDatabase.length === 0) { toast('Load a CSV first'); return; }
  const firstHeader = csvHeaders[0];
  const match = codeDatabase.find(row => {
    const val = row[firstHeader]?.replace(/\D/g, '') || '';
    return val === searchCode;
  });
  showMatchResult(searchCode, match);
  addToHistory(searchCode, !!match);
}

function showMatchResult(code, match) {
  const card = document.getElementById('matchCard');
  const icon = document.getElementById('matchIcon');
  const title = document.getElementById('matchTitle');
  const codeEl = document.getElementById('matchCode');
  const dataEl = document.getElementById('matchData');
  card.style.display = 'block';
  card.className = 'match-card ' + (match ? 'match-found' : 'match-notfound');
  icon.textContent = match ? '✅' : '❌';
  title.textContent = match ? 'Code Found!' : 'Code Not Found';
  codeEl.textContent = code;
  if (match) {
    dataEl.innerHTML = '';
    Object.entries(match).forEach(([key, val]) => {
      if (!val) return;
      const row = document.createElement('div');
      row.className = 'data-row';
      row.innerHTML = `<span class="data-key">${key}</span><span class="data-val">${val}</span>`;
      dataEl.appendChild(row);
    });
  } else {
    dataEl.innerHTML = `<div style="color:var(--muted);font-size:13px">No record found for code <strong style="color:var(--text)">${code}</strong> in the database.</div>`;
  }
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function addToHistory(code, found) {
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  scanHistory.unshift({ code, found, time });
  if (scanHistory.length > 20) scanHistory.pop();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (scanHistory.length === 0) {
    list.innerHTML = '<div class="empty-state">No scans yet</div>';
    return;
  }
  list.innerHTML = scanHistory.map((item) => `
    <div class="history-item" onclick="lookupCode('${item.code}')">
      <span class="history-dot ${item.found ? 'dot-found' : 'dot-notfound'}"></span>
      <span class="history-code">${item.code}</span>
      <span class="history-time">${item.time}</span>
    </div>
  `).join('');
}

// Drag & drop for CSV
const uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (ev) => parseCSV(ev.target.result, file.name);
    reader.readAsText(file);
  }
});

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
